<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChatApp — Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}

:root{
  --sidebar:#111b21;
  --sidebar-hover:#202c33;
  --sidebar-active:#2a3942;
  --chat-bg:#0b141a;
  --header:#202c33;
  --input-bg:#2a3942;
  --bubble-in:#202c33;
  --bubble-out:#005c4b;
  --green:#00a884;
  --text:#e9edef;
  --muted:#8696a0;
  --divider:#2a3942;
  --tick-read:#53bdeb;
  --font:'Inter',-apple-system,sans-serif;
}

html,body{height:100%;overflow:hidden;background:var(--sidebar);}
body{font-family:var(--font);font-size:14px;color:var(--text);display:flex;flex-direction:column;}

/* topbar */
.topbar{height:40px;background:#1f2c34;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;border-bottom:1px solid var(--divider);}
.topbar-logo{font-weight:700;font-size:15px;color:var(--green);letter-spacing:-.3px;}
.topbar-sub{font-size:11px;color:var(--muted);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.notif-btn{background:transparent;border:1px solid var(--divider);color:var(--muted);font-family:var(--font);font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:border-color .15s,color .15s;}
.notif-btn:hover{border-color:var(--green);color:var(--green);}
.notif-btn.granted{border-color:var(--green);color:var(--green);}
.notif-btn.denied{border-color:#f87171;color:#f87171;cursor:default;}
.srv-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.srv-dot.on{background:var(--green);box-shadow:0 0 5px var(--green);}
.srv-label{font-size:11px;color:var(--muted);}

/* layout */
.app{display:flex;flex:1;overflow:hidden;}

/* sidebar */
.sidebar{width:360px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid var(--divider);}
.sidebar-header{height:56px;background:var(--header);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;position:relative;}
.you-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;cursor:pointer;position:relative;}
.you-name{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.you-status{font-size:11px;color:var(--green);}
.sidebar-icons{display:flex;gap:4px;margin-left:auto;}
.icon-btn{width:34px;height:34px;border-radius:50%;background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;}
.icon-btn:hover{background:var(--sidebar-hover);}

.you-picker{position:absolute;top:100%;left:0;width:360px;background:var(--header);border:1px solid var(--divider);border-top:none;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;max-height:380px;overflow-y:auto;}
.you-picker.open{display:block;}
.you-picker-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .1s;border-bottom:1px solid rgba(42,57,66,.4);}
.you-picker-item:hover{background:var(--sidebar-hover);}

.sidebar-search{padding:8px 12px;background:var(--sidebar);border-bottom:1px solid var(--divider);flex-shrink:0;}
.search-wrap{background:var(--input-bg);border-radius:8px;display:flex;align-items:center;padding:0 12px;gap:8px;}
.search-wrap input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:13px;padding:8px 0;flex:1;}
.search-wrap input::placeholder{color:var(--muted);}

.user-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--divider) transparent;}

.user-item{display:flex;align-items:center;padding:10px 16px;gap:12px;cursor:pointer;transition:background .1s;border-bottom:1px solid rgba(42,57,66,.5);}
.user-item:hover{background:var(--sidebar-hover);}
.user-item.active{background:var(--sidebar-active);}

.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;position:relative;}
.av-ring{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--sidebar);display:none;}
.av-online .av-ring{display:block;}

.user-info{flex:1;min-width:0;}
.user-info-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
.ui-name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.ui-time{font-size:11px;color:var(--muted);flex-shrink:0;}
.ui-time.unread-t{color:var(--green);}
.user-info-bot{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.ui-preview{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.badge{background:var(--green);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:none;align-items:center;justify-content:center;flex-shrink:0;}
.badge.show{display:flex;}

/* chat area */
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);overflow:hidden;position:relative;}
.chat-area::before{content:'';position:absolute;inset:0;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5L55 20v20L30 55 5 40V20z' fill='none' stroke='%23fff' stroke-width='1'/%3E%3C/svg%3E");background-size:60px;pointer-events:none;}

.chat-header{height:56px;background:var(--header);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:1;border-bottom:1px solid var(--divider);}
.ch-name{font-weight:600;font-size:14px;}
.ch-sub{font-size:12px;color:var(--green);}
.chat-h-icons{display:flex;gap:4px;margin-left:auto;}

.messages{flex:1;overflow-y:auto;padding:12px 10%;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:var(--divider) transparent;z-index:1;}

.date-div{text-align:center;margin:10px 0;font-size:11px;color:var(--muted);}
.date-div span{background:rgba(11,20,26,.88);padding:4px 12px;border-radius:7px;}

.bwrap{display:flex;flex-direction:column;animation:bIn .14s ease;}
.bwrap.out{align-items:flex-end;}
.bwrap.in{align-items:flex-start;}
@keyframes bIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.bsender{font-size:11px;font-weight:600;margin-bottom:2px;padding-left:2px;}

.bubble{max-width:65%;padding:7px 10px 4px;border-radius:8px;position:relative;word-break:break-word;line-height:1.46;font-size:13.5px;}
.bwrap.in .bubble{background:var(--bubble-in);border-top-left-radius:2px;}
.bwrap.out .bubble{background:var(--bubble-out);border-top-right-radius:2px;}

.bmeta{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:rgba(233,237,239,.5);margin-top:2px;}
.ticks{font-size:13px;}
.ticks.sent{color:rgba(233,237,239,.5);}
.ticks.delivered{color:rgba(233,237,239,.5);}
.ticks.read{color:var(--tick-read);}

.sys-msg{text-align:center;margin:4px 0;font-size:11.5px;color:var(--muted);}
.sys-msg span{background:rgba(11,20,26,.75);padding:3px 10px;border-radius:7px;}

.typing-bar{min-height:26px;padding:2px 16px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);z-index:1;flex-shrink:0;}
.tdots{display:flex;gap:3px;align-items:center;}
.tdots span{width:5px;height:5px;border-radius:50%;background:var(--green);animation:td 1.2s infinite;}
.tdots span:nth-child(2){animation-delay:.2s;}
.tdots span:nth-child(3){animation-delay:.4s;}
@keyframes td{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}

.input-bar{padding:8px 16px;background:var(--header);display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:1;}
.input-wrap{flex:1;background:var(--input-bg);border-radius:24px;display:flex;align-items:center;padding:0 16px;}
.input-wrap input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:14px;padding:10px 0;}
.input-wrap input::placeholder{color:var(--muted);}
.send-btn{width:46px;height:46px;border-radius:50%;background:var(--green);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:background .15s,transform .1s;flex-shrink:0;}
.send-btn:hover{background:#008f72;}
.send-btn:active{transform:scale(.92);}
.send-btn:disabled{background:var(--input-bg);cursor:default;}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);z-index:1;}
.empty-state svg{opacity:.18;}
.empty-state h3{font-size:22px;font-weight:300;color:var(--text);}
.empty-state p{font-size:13px;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--divider);border-radius:3px;}

/* ── Hover action bar ────────────────────────────────────────────────────── */
.bwrap{position:relative;}
.msg-actions{
  position:absolute;top:-18px;
  display:none;
  background:#1f2c34;
  border:1px solid var(--divider);
  border-radius:20px;
  padding:3px 6px;
  gap:2px;
  align-items:center;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
  z-index:10;
  white-space:nowrap;
}
.bwrap.out .msg-actions{right:8px;}
.bwrap.in  .msg-actions{left:8px;}
.bwrap:hover .msg-actions{display:flex;}
.msg-actions button{
  background:transparent;border:none;cursor:pointer;
  font-size:15px;padding:2px 5px;border-radius:12px;
  transition:background .12s,transform .1s;
  line-height:1;
}
.msg-actions button:hover{background:rgba(255,255,255,.1);transform:scale(1.15);}
.msg-actions .act-divider{width:1px;height:14px;background:var(--divider);margin:0 2px;flex-shrink:0;}

/* ── Reactions strip under bubble ────────────────────────────────────────── */
.reactions{
  display:flex;flex-wrap:wrap;gap:4px;
  margin-top:3px;
  padding:0 2px;
}
.reaction-pill{
  display:inline-flex;align-items:center;gap:3px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:2px 7px;
  font-size:12px;cursor:pointer;
  transition:background .12s,border-color .12s;
  user-select:none;
}
.reaction-pill:hover{background:rgba(255,255,255,.13);}
.reaction-pill.mine{
  border-color:var(--green);
  background:rgba(0,168,132,.12);
}
.reaction-pill .r-count{font-size:11px;color:var(--muted);}
.reaction-pill.mine .r-count{color:var(--green);}

/* ── Reply quote in bubble ───────────────────────────────────────────────── */
.reply-quote{
  border-left:3px solid var(--green);
  padding:4px 8px;
  border-radius:4px;
  background:rgba(0,0,0,.2);
  margin-bottom:6px;
  font-size:11.5px;
}
.reply-quote .rq-sender{font-weight:600;color:var(--green);margin-bottom:1px;}
.reply-quote .rq-text{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;}

/* ── Reply preview bar above input ──────────────────────────────────────── */
.reply-bar{
  padding:8px 16px 0;
  background:var(--header);
  display:none;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.reply-bar.show{display:flex;}
.reply-bar-inner{
  flex:1;
  border-left:3px solid var(--green);
  padding:4px 10px;
  background:rgba(0,0,0,.2);
  border-radius:4px;
  min-width:0;
}
.reply-bar-sender{font-size:11px;font-weight:600;color:var(--green);}
.reply-bar-text{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-cancel{
  background:transparent;border:none;color:var(--muted);
  font-size:18px;cursor:pointer;padding:2px 6px;
  border-radius:50%;transition:color .12s,background .12s;flex-shrink:0;
}
.reply-cancel:hover{color:var(--text);background:rgba(255,255,255,.08);}

/* ── @ mention autocomplete ──────────────────────────────────────────────── */
.mention-popup{
  position:absolute;bottom:100%;left:16px;
  background:#1a2733;
  border:1px solid var(--divider);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 -4px 20px rgba(0,0,0,.5);
  display:none;
  z-index:50;
  min-width:200px;max-width:280px;
}
.mention-popup.show{display:block;}
.mention-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;cursor:pointer;
  transition:background .1s;
}
.mention-item:hover,.mention-item.active{background:var(--sidebar-active);}
.mention-av{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12px;flex-shrink:0;
}
.mention-name{font-size:13px;font-weight:500;}
.mention-header{
  padding:6px 14px 4px;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  border-bottom:1px solid var(--divider);
}

/* Highlight @mention inside bubble text */
.at-mention{
  color:var(--green);font-weight:600;
  background:rgba(0,168,132,.1);
  border-radius:3px;padding:0 2px;
}

/* ── File attachment styles ──────────────────────────────────────────────── */
.attach-btn{
  width:38px;height:38px;border-radius:50%;background:transparent;border:none;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;transition:color .15s,background .15s;
}
.attach-btn:hover{color:var(--green);background:rgba(0,168,132,.08);}
.attach-btn:disabled{opacity:.35;cursor:default;}

/* Upload progress bar inside input bar */
.upload-progress{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:var(--divider);overflow:hidden;display:none;
}
.upload-progress.show{display:block;}
.upload-progress-bar{height:100%;background:var(--green);width:0%;transition:width .2s;}

/* File bubble */
.file-bubble{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:inherit;
  border-top:1px solid rgba(255,255,255,.06);
  margin-top:6px;
  border-radius:6px;
  text-decoration:none;
  cursor:pointer;
  transition:background .1s;
  min-width:200px;max-width:100%;
}
.file-bubble:hover{background:rgba(255,255,255,.06);}
.file-icon{
  width:40px;height:40px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.file-icon.pdf  {background:rgba(239,68,68,.15);color:#ef4444;}
.file-icon.word {background:rgba(59,130,246,.15);color:#3b82f6;}
.file-icon.excel{background:rgba(34,197,94,.15); color:#22c55e;}
.file-icon.csv  {background:rgba(234,179,8,.15);  color:#eab308;}
.file-details{flex:1;min-width:0;}
.file-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.file-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.file-dl{font-size:16px;color:var(--muted);flex-shrink:0;}

/* Upload error toast */
.upload-toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#1f2c34;border:1px solid #e53935;
  color:#ff6b6b;font-size:12px;padding:8px 16px;
  border-radius:8px;z-index:500;white-space:nowrap;
  animation:toastIn .2s ease;display:none;
}
.upload-toast.show{display:block;}

/* ── Video call styles ─────────────────────────────────────────────────────── */
/* Incoming call toast */
.call-toast{
  position:fixed;top:20px;right:20px;z-index:1000;
  background:#1f2c34;border:1px solid #2a3942;
  border-radius:16px;padding:16px 20px;width:300px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  animation:toastIn .25s ease;
  display:none;
}
.call-toast.show{display:block;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.ct-caller{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.ct-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;}
.ct-info{}
.ct-name{font-weight:600;font-size:14px;}
.ct-label{font-size:11px;color:var(--muted);margin-top:1px;}
.ct-label span{color:var(--green);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ct-btns{display:flex;gap:10px;}
.ct-btn{flex:1;padding:9px;border-radius:10px;border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.ct-btn.accept{background:var(--green);color:#fff;}
.ct-btn.reject{background:#e53935;color:#fff;}
.ct-btn:hover{opacity:.85;}

/* Full-screen call overlay */
.call-screen{
  position:fixed;inset:0;z-index:900;
  background:#0b141a;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
}
.call-screen.show{display:flex;}

/* Remote video fills screen */
#remoteVideo{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  background:#000;
}
/* Local video pip */
#localVideo{
  position:absolute;bottom:100px;right:20px;
  width:140px;height:100px;
  object-fit:cover;border-radius:12px;
  border:2px solid rgba(255,255,255,.2);
  background:#111;
  z-index:2;
}

/* Waiting / no-video state */
.call-waiting{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  pointer-events:none;
}
.call-waiting-avatar{
  width:90px;height:90px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:34px;
  box-shadow:0 0 0 0 rgba(0,168,132,.5);
  animation:ring 1.8s infinite;
}
@keyframes ring{
  0%{box-shadow:0 0 0 0 rgba(0,168,132,.5)}
  70%{box-shadow:0 0 0 22px rgba(0,168,132,0)}
  100%{box-shadow:0 0 0 0 rgba(0,168,132,0)}
}
.call-waiting-name{font-size:22px;font-weight:600;color:#fff;}
.call-waiting-status{font-size:13px;color:var(--muted);}

/* Controls bar */
.call-controls{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:3;display:flex;gap:14px;align-items:center;
}
.cc-btn{
  width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,opacity .15s;font-size:20px;
}
.cc-btn:hover{opacity:.85;}
.cc-btn:active{transform:scale(.92);}
.cc-btn.mute{background:#374151;}
.cc-btn.cam{background:#374151;}
.cc-btn.hangup{background:#e53935;width:62px;height:62px;font-size:22px;}
.cc-btn.off{background:#6b7280;}

/* call btn in chat header */
.call-start-btn{
  width:34px;height:34px;border-radius:50%;
  background:transparent;border:none;
  color:var(--green);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:background .15s;
}
.call-start-btn:hover{background:var(--sidebar-hover);}

/* call duration timer */
.call-timer{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  z-index:3;font-size:13px;color:rgba(255,255,255,.7);
  background:rgba(0,0,0,.35);padding:4px 12px;border-radius:20px;
  display:none;
}
.call-timer.show{display:block;}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">● ChatApp</span>
  <span class="topbar-sub">Socket.IO · 10 users · web notifications</span>
  <div class="topbar-right">
    <button class="notif-btn" id="notifBtn" onclick="requestNotifPermission()">
      <span id="notifIcon">🔔</span><span id="notifLabel">Enable Notifications</span>
    </button>
    <div class="srv-dot" id="srvDot"></div>
    <span class="srv-label" id="srvLabel">—</span>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="you-avatar" id="youAvatar" onclick="togglePicker()">?</div>
      <div>
        <div class="you-name" id="youName">Choose your identity</div>
        <div class="you-status" id="youStatus">tap avatar to pick</div>
      </div>
      <div class="sidebar-icons">
        <button class="icon-btn">💬</button>
        <button class="icon-btn">⋮</button>
      </div>
      <div class="you-picker" id="youPicker"></div>
    </div>
    <div class="sidebar-search">

        <input type="text" placeholder="Search or start new chat" oninput="filterList(this.value)"/>
      </div>
    </div>
    <div class="user-list" id="userList"></div>

    <div class="empty-state">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=".8">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>

      <h3>ChatApp Web</h3>
      <p>Pick your identity, then open a chat</p>
    </div>
  </div>
</div>

<div class="upload-toast" id="uploadToast"></div>

<div class="call-screen" id="callScreen">

    <button class="cc-btn hangup" onclick="hangUp()" title="Hang up">📵</button>
  </div>
</div>

<script>
const ROOM = 'general';

const USERS = [
  { id:'u1',  name:'Alice',   color:'#7c6aff' },
  { id:'u2',  name:'Bob',     color:'#ff6a9e' },
  { id:'u3',  name:'Charlie', color:'#f59e0b' },
  { id:'u4',  name:'Diana',   color:'#10b981' },
  { id:'u5',  name:'Ethan',   color:'#3b82f6' },
  { id:'u6',  name:'Fiona',   color:'#ec4899' },
  { id:'u7',  name:'George',  color:'#8b5cf6' },
  { id:'u8',  name:'Hannah',  color:'#06b6d4' },
  { id:'u9',  name:'Ivan',    color:'#f97316' },
  { id:'u10', name:'Julia',   color:'#84cc16' },
];

// ── State ─────────────────────────────────────────────────────────────────────
let me = null, socket = null;
let activePeer = null;
let onlineIds = new Set();
let unread = {};             // 'group' | userId → count
let lastMsgInfo = {};        // same keys → {text,time}
let allMessages = [];        // group room messages
let dmMessages = {};         // userId → msg[]  (per-peer DM history)
let peerTyping = {};         // userId → bool  (group typing)
let dmTyping = {};           // userId → bool  (DM typing)
let filterStr = '';

// mirrors server getDmRoomId — same sort logic
function store_getDmRoomId(a, b) {
  return 'dm:' + [a, b].sort().join(':');
}

// ── utils ─────────────────────────────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtT = ts => new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

function mkAvatar(user, size=46) {
  const fs = Math.round(size * .38);
  return `<div class="avatar" style="background:${user.color};width:${size}px;height:${size}px;font-size:${fs}px">
    ${user.name.charAt(0)}<div class="av-ring"></div></div>`;
}
function avatarURI(user) {
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
    <rect width="64" height="64" rx="32" fill="${user.color}"/>
    <text x="32" y="44" font-size="28" font-family="sans-serif" font-weight="bold" fill="white" text-anchor="middle">${user.name.charAt(0)}</text></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(s);
}

// ── Notifications ─────────────────────────────────────────────────────────────
const Notifs = {
  perm: () => 'Notification' in window ? Notification.permission : 'unsupported',
  async request() {
    if (!('Notification' in window)) { this._upd('unsupported'); return; }
    this._upd(await Notification.requestPermission());
  },
  _upd(s) {
    const btn=document.getElementById('notifBtn'),
          ic=document.getElementById('notifIcon'),
          lb=document.getElementById('notifLabel');
    if (s==='granted')     { ic.textContent='🔔'; lb.textContent='Notifications on';  btn.className='notif-btn granted'; btn.disabled=true; }
    else if (s==='denied') { ic.textContent='🔕'; lb.textContent='Blocked';            btn.className='notif-btn denied';  btn.disabled=true; }
    else if (s==='unsupported'){ ic.textContent='🚫'; lb.textContent='Not supported';  btn.disabled=true; }
  },
  fire(msg, sender) {
    if (Notification.permission !== 'granted') return;
    const n = new Notification(sender.name, {
      body: msg.content.length>80 ? msg.content.slice(0,80)+'…' : msg.content,
      icon: avatarURI(sender), tag:`chat-${sender.id}`, renotify:true,
    });
    n.onclick = e => { e.preventDefault(); window.focus(); n.close(); };
    setTimeout(() => n.close(), 5000);
  },
};
function requestNotifPermission() { Notifs.request(); }
(()=>{ const p=Notifs.perm(); if(p!=='default') Notifs._upd(p); })();

function previewText(lm) {
  if (!lm) return null;
  if (lm.type === 'file') {
    try {
      const f = JSON.parse(lm.text);
      return `📎 ${f.originalName || 'File'}`;
    } catch(e) { return '📎 File'; }
  }
  return lm.text;
}
function buildPicker() {
  document.getElementById('youPicker').innerHTML =
    USERS.map(u=>`<div class="you-picker-item" onclick="switchUser('${u.id}')">
      ${mkAvatar(u,32)}<span style="font-size:13px">${u.name}</span>
      ${onlineIds.has(u.id)?'<span style="color:var(--green);font-size:11px;margin-left:auto">online</span>':''}
    </div>`).join('');
}

function renderList() {
  const fl = filterStr.toLowerCase();
  const list = document.getElementById('userList');

  // group entry
  const gu = unread['group']||0;
  const gl = lastMsgInfo['group'];
  const typers = USERS.filter(u=>u.id!==me?.id && peerTyping[u.id]).map(u=>u.name);
  const gActive = activePeer==='group';

  let html = '';
  if (!fl || 'group general'.includes(fl)) {
    html += `<div class="user-item${gActive?' active':''}" onclick="openChat('group')" id="li-group">
      <div class="avatar" style="background:#1f6e5e;width:46px;height:46px;font-size:20px">
        👥<div class="av-ring" style="display:block;background:var(--green)"></div>
      </div>
      <div class="user-info">
        <div class="user-info-top">
          <span class="ui-name">Group · general</span>
          <span class="ui-time${gu?' unread-t':''}">${gl?fmtT(gl.time):''}</span>
        </div>
        <div class="user-info-bot">
          <span class="ui-preview">${typers.length ? `<span style="color:var(--green)">${esc(typers.join(', '))} typing…</span>` : (gl?esc(previewText(gl)||''):'10 members')}</span>
          <span class="badge${gu?' show':''}">${gu||''}</span>
        </div>
      </div>
    </div>`;
  }

  USERS.filter(u=>u.id!==me?.id).filter(u=>!fl||u.name.toLowerCase().includes(fl)).forEach(u => {
    const online = onlineIds.has(u.id);
    const ub = unread[u.id]||0;
    const lm = lastMsgInfo[u.id];
    const typing = peerTyping[u.id];
    const active = activePeer && activePeer!=='group' && activePeer.id===u.id;
    html += `<div class="user-item${active?' active':''}" onclick="openChat('${u.id}')" id="li-${u.id}">
      <div class="avatar${online?' av-online':''}" style="background:${u.color};width:46px;height:46px;font-size:18px">
        ${u.name.charAt(0)}<div class="av-ring"></div>
      </div>
      <div class="user-info">
        <div class="user-info-top">
          <span class="ui-name">${u.name}</span>
          <span class="ui-time${ub?' unread-t':''}">${lm?fmtT(lm.time):''}</span>
        </div>
        <div class="user-info-bot">
          <span class="ui-preview">${dmTyping[u.id]?'<span style="color:var(--green)">typing…</span>':(lm?esc(previewText(lm)):(online?'online':'last seen recently'))}</span>
          <span class="badge${ub?' show':''}">${ub||''}</span>
        </div>
      </div>
    </div>`;
  });

  list.innerHTML = html;
}

function filterList(v) { filterStr = v; renderList(); }
function togglePicker() {
  buildPicker();
  document.getElementById('youPicker').classList.toggle('open');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('#youPicker')&&!e.target.closest('#youAvatar'))
    document.getElementById('youPicker').classList.remove('open');
});

// ── Switch identity ───────────────────────────────────────────────────────────
function switchUser(uid) {
  document.getElementById('youPicker').classList.remove('open');
  if (me?.id===uid) return;
  if (socket) { socket.disconnect(); socket=null; }
  if (pc) { pc.close(); pc=null; }
  if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  hideCallScreen(); hideCallToast();
  callPeerId=null; callPeerUser=null;

  me = USERS.find(u=>u.id===uid);
  activePeer=null; unread={}; lastMsgInfo={}; allMessages=[]; dmMessages={}; peerTyping={}; dmTyping={}; onlineIds=new Set();

  const av = document.getElementById('youAvatar');
  av.style.cssText=`background:${me.color};width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;cursor:pointer;position:relative;`;
  av.innerHTML = me.name.charAt(0) + '<div class="av-ring" style="display:block;border-color:var(--header)"></div>';
  document.getElementById('youName').textContent = me.name;
  document.getElementById('youStatus').textContent = 'online';

  showEmpty();
  renderList();
  connectSocket();
}

// ── Socket ────────────────────────────────────────────────────────────────────
function connectSocket() {
  socket = window.io();
  wireCallEvents();

  socket.on('connect', ()=>{
    document.getElementById('srvDot').className='srv-dot on';
    document.getElementById('srvLabel').textContent='connected';
    socket.emit('auth', { userId:me.id, username:me.name });
    socket.emit('join_room', { roomId:ROOM, roomName:'general' });
  });

  socket.on('disconnect', ()=>{
    document.getElementById('srvDot').className='srv-dot';
    document.getElementById('srvLabel').textContent='disconnected';
  });

  // auth_success carries onlineUsers
  socket.on('auth_success', ({onlineUsers})=>{
    onlineIds = new Set((onlineUsers||[]).map(u=>u.userId));
    renderList();
  });

  socket.on('online_users', users=>{
    onlineIds = new Set(users.map(u=>u.userId));
    renderList();
  });

  socket.on('user_online', d=>{
    onlineIds.add(d.userId); renderList(); refreshChatHeader();
  });
  socket.on('user_offline', d=>{
    onlineIds.delete(d.userId); renderList(); refreshChatHeader();
  });

  socket.on('room_history', ({messages:msgs})=>{
    allMessages = msgs;
    msgs.forEach(m=>{ lastMsgInfo['group']={text:m.content,time:m.createdAt,type:m.type}; });
    if (activePeer==='group') renderMessages();
    renderList();
  });

  socket.on('dm_history', ({toUserId, messages:msgs})=>{
    dmMessages[toUserId] = msgs;
    if (msgs.length) {
      const last = msgs[msgs.length-1];
      lastMsgInfo[toUserId] = {text:last.content, time:last.createdAt, type:last.type};
    }
    if (activePeer && activePeer!=='group' && activePeer.id===toUserId) renderMessages();
    renderList();
  });

  socket.on('new_message', msg=>{
    allMessages.push(msg);
    lastMsgInfo['group']={text:msg.content,time:msg.createdAt,type:msg.type};
    const isMe = msg.senderId===me.id;
    const sender = USERS.find(u=>u.id===msg.senderId);
    if (!isMe) {
      if (activePeer!=='group') unread['group']=(unread['group']||0)+1;
      if (sender) Notifs.fire(msg, sender);
      socket.emit('message_delivered',{roomId:ROOM,messageId:msg.id});
      if (activePeer==='group')
        setTimeout(()=>socket.emit('message_read',{roomId:ROOM,messageId:msg.id}),700);
    }
    if (activePeer==='group') appendBubble(msg, isMe, sender);
    renderList();
  });

  socket.on('new_dm', msg=>{
    const isMe = msg.senderId===me.id;
    const peerId = isMe ? msg.toUserId : msg.senderId;
    const sender = USERS.find(u=>u.id===msg.senderId);
    if (!dmMessages[peerId]) dmMessages[peerId]=[];
    dmMessages[peerId].push(msg);
    lastMsgInfo[peerId]={text:msg.content, time:msg.createdAt, type:msg.type};
    if (!isMe) {
      const dmRoomId = store_getDmRoomId(me.id, peerId);
      if (!activePeer || activePeer==='group' || activePeer.id!==peerId)
        unread[peerId]=(unread[peerId]||0)+1;
      if (sender) Notifs.fire(msg, sender);
      socket.emit('message_delivered',{roomId:dmRoomId,messageId:msg.id});
      if (activePeer && activePeer!=='group' && activePeer.id===peerId)
        setTimeout(()=>socket.emit('message_read',{roomId:dmRoomId,messageId:msg.id}),700);
    }
    if (activePeer && activePeer!=='group' && activePeer.id===peerId)
      appendBubble(msg, isMe, sender);
    renderList();
  });

  socket.on('typing_update', data=>{
    const tset = new Set(data.typingUsers);
    USERS.forEach(u=>{ peerTyping[u.id] = tset.has(u.id) && u.id!==me.id; });
    renderList(); refreshTypingBar();
  });

  socket.on('dm_typing_update', ({fromUserId, isTyping})=>{
    dmTyping[fromUserId] = isTyping;
    if (activePeer && activePeer!=='group' && activePeer.id===fromUserId) refreshTypingBar();
    renderList();
  });

  socket.on('message_status', data=>{
    const tick = document.getElementById('tk-'+data.messageId);
    if (!tick) return;
    const map={sent:'✓',delivered:'✓✓',read:'✓✓'};
    tick.textContent = map[data.status]||'✓';
    tick.className = 'ticks '+data.status;
  });
}

// ── Chat UI ───────────────────────────────────────────────────────────────────
function showEmpty() {
  document.getElementById('chatArea').innerHTML=`<div class="empty-state">
    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=".8">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <h3>ChatApp Web</h3>
    <p>Select a conversation to start messaging</p>
  </div>`;
}

function openChat(uid) {
  if (!me) { alert('Pick your identity first (tap the avatar)'); return; }
  activePeer = uid==='group' ? 'group' : USERS.find(u=>u.id===uid);
  const key = uid==='group' ? 'group' : uid;
  unread[key] = 0;

  // Request DM history from server if it's a 1:1 chat
  if (uid !== 'group' && socket) {
    socket.emit('get_dm_history', { toUserId: uid });
  }

  buildChatUI();
  renderList();
}

function buildChatUI() {
  const isGroup = activePeer==='group';
  const pName = isGroup ? 'Group · general' : activePeer.name;
  const pColor= isGroup ? '#1f6e5e' : activePeer.color;
  const pInit = isGroup ? '👥' : activePeer.name.charAt(0);
  const pOnline= isGroup ? true : onlineIds.has(activePeer.id);
  const subTxt = isGroup ? `${onlineIds.size} of 10 online` : (pOnline?'online':'last seen recently');

  document.getElementById('chatArea').innerHTML=`
    <div class="chat-header">
      <div class="avatar${pOnline&&!isGroup?' av-online':''}" style="background:${pColor};width:38px;height:38px;font-size:15px">
        ${pInit}<div class="av-ring"></div>
      </div>
      <div>
        <div class="ch-name">${esc(pName)}</div>
        <div class="ch-sub" id="chSub">${subTxt}</div>
      </div>
      <div class="chat-h-icons">
        ${!isGroup ? `<button class="call-start-btn" onclick="startCall('${activePeer.id}')" title="Video call">📹</button>` : ''}
        <button class="icon-btn">🔍</button>
        <button class="icon-btn">📎</button>
        <button class="icon-btn">⋮</button>
      </div>
    </div>
    <div class="messages" id="msgBox"></div>
    <div class="typing-bar" id="typingBar"></div>
    <div class="reply-bar" id="replyBar">
      <div class="reply-bar-inner">
        <div class="reply-bar-sender" id="replyBarSender"></div>
        <div class="reply-bar-text"   id="replyBarText"></div>
      </div>
      <button class="reply-cancel" onclick="cancelReply()" title="Cancel reply">✕</button>
    </div>
    <div class="input-bar" style="position:relative">
      <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.xlsx,.xls,.csv"
        style="display:none" onchange="onFileChosen(this)"/>
      <button class="attach-btn" id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Attach document (PDF, DOCX, XLSX, CSV · max 5 MB)">📎</button>
      <div class="input-wrap" style="position:relative">
        <input type="text" id="msgInput" placeholder="Type a message"
          onkeydown="onKey(event)" oninput="onType()" onkeydown="onKey(event)"/>
        <div class="mention-popup" id="mentionPopup"></div>
      </div>
      <button class="send-btn" onclick="sendMsg()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
      <div class="upload-progress" id="uploadProgress"><div class="upload-progress-bar" id="uploadBar"></div></div>
    </div>`;

  renderMessages();
  refreshTypingBar();
}

function renderMessages() {
  const box = document.getElementById('msgBox');
  if (!box) return;
  box.innerHTML='';
  const isGroup = activePeer==='group';
  const msgs = isGroup ? allMessages : (dmMessages[activePeer?.id] || []);
  let lastDate='';
  msgs.forEach(msg=>{
    const d = new Date(msg.createdAt).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
    if (d!==lastDate) {
      lastDate=d;
      box.insertAdjacentHTML('beforeend',`<div class="date-div"><span>${d}</span></div>`);
    }
    const isMe=msg.senderId===me.id;
    const sender=USERS.find(u=>u.id===msg.senderId);
    appendBubble(msg,isMe,sender);
  });
}

// ── In-memory reactions store: msgId → { emoji → Set<userId> }
const msgReactions = {};

function getReactions(msgId) {
  return msgReactions[msgId] || {};
}

function toggleReaction(msgId, emoji) {
  if (!msgReactions[msgId]) msgReactions[msgId] = {};
  if (!msgReactions[msgId][emoji]) msgReactions[msgId][emoji] = new Set();
  const set = msgReactions[msgId][emoji];
  if (set.has(me.id)) { set.delete(me.id); } else { set.add(me.id); }
  if (set.size === 0) delete msgReactions[msgId][emoji];
  refreshReactions(msgId);
}

function refreshReactions(msgId) {
  const strip = document.getElementById('rx-'+msgId);
  if (!strip) return;
  const data = getReactions(msgId);
  const entries = Object.entries(data).filter(([,s])=>s.size>0);
  strip.innerHTML = entries.map(([emoji, set])=>{
    const mine = set.has(me.id);
    return `<span class="reaction-pill${mine?' mine':''}" onclick="toggleReaction('${msgId}','${emoji}')" title="${[...set].map(uid=>USERS.find(u=>u.id===uid)?.name||uid).join(', ')}">
      ${emoji}<span class="r-count">${set.size}</span>
    </span>`;
  }).join('');
}

// Render @mentions highlighted in message text
function renderText(text) {
  return esc(text).replace(/@(\w+)/g, (match, name)=>{
    const found = USERS.find(u=>u.name.toLowerCase()===name.toLowerCase());
    if (!found) return match;
    return `<span class="at-mention" style="color:${found.color}">${match}</span>`;
  });
}

function appendBubble(msg, isMe, sender) {
  const box=document.getElementById('msgBox');
  if (!box) return;
  const ticks={sent:'✓',delivered:'✓✓',read:'✓✓'};
  const tc = msg.status||'sent';
  const wrap=document.createElement('div');
  wrap.className=`bwrap ${isMe?'out':'in'}`;
  wrap.dataset.msgId=msg.id;

  // ── Reply quote ────────────────────────────────────────────────────────────
  let quoteHTML = '';
  if (msg.replyTo) {
    const qSender = USERS.find(u=>u.id===msg.replyTo.senderId);
    const qName = qSender?.name || msg.replyTo.senderName || 'Unknown';
    const qColor = qSender?.color || '#8696a0';
    const qText = msg.replyTo.type==='file' ? '📎 File' : (msg.replyTo.content||'').slice(0,80);
    quoteHTML = `<div class="reply-quote">
      <div class="rq-sender" style="color:${qColor}">${esc(qName)}</div>
      <div class="rq-text">${esc(qText)}</div>
    </div>`;
  }

  // ── File bubble ────────────────────────────────────────────────────────────
  let contentHTML = '';
  if (msg.type === 'file') {
    let fileData = null;
    try { fileData = JSON.parse(msg.content); } catch(e){}
    if (fileData) {
      const fi = fileIconInfo(fileData.originalName || fileData.storedName || '');
      contentHTML = `<a class="file-bubble" href="${esc(fileData.url)}" target="_blank" rel="noopener" download="${esc(fileData.originalName||'')}">
        <div class="file-icon ${fi.cls}">${fi.icon}</div>
        <div class="file-details">
          <div class="file-name">${esc(fileData.originalName||fileData.storedName)}</div>
          <div class="file-meta">${fileData.label||fi.cls.toUpperCase()} · ${fileSizeLabel(fileData.size||0)}</div>
        </div>
        <span class="file-dl">⬇</span>
      </a>`;
    } else { contentHTML = esc(msg.content); }
  } else {
    contentHTML = renderText(msg.content);
  }

  // ── Hover action bar ───────────────────────────────────────────────────────
  // Shown on .bwrap:hover — positioned above the bubble
  const actionsHTML = `<div class="msg-actions">
    <button onclick="toggleReaction('${msg.id}','❤️')"  title="Love">❤️</button>
    <button onclick="toggleReaction('${msg.id}','👍')"  title="Like">👍</button>
    <button onclick="toggleReaction('${msg.id}','😂')"  title="Haha">😂</button>
    <button onclick="toggleReaction('${msg.id}','😮')"  title="Wow">😮</button>
    <button onclick="toggleReaction('${msg.id}','😢')"  title="Sad">😢</button>
    <div class="act-divider"></div>
    <button onclick="startReply('${msg.id}')" title="Reply">↩</button>
  </div>`;

  wrap.innerHTML=`
    ${actionsHTML}
    ${!isMe&&activePeer==='group'?`<div class="bsender" style="color:${sender?.color||'#8696a0'}">${esc(sender?.name||'')}</div>`:''}
    <div class="bubble">
      ${quoteHTML}
      ${contentHTML}
      <div class="bmeta">
        <span>${fmtT(msg.createdAt)}</span>
        ${isMe?`<span class="ticks ${tc}" id="tk-${msg.id}">${ticks[tc]||'✓'}</span>`:''}
      </div>
    </div>
    <div class="reactions" id="rx-${msg.id}"></div>`;

  box.appendChild(wrap);
  box.scrollTop=box.scrollHeight;

  // Restore any existing reactions (e.g. on re-render)
  refreshReactions(msg.id);
}

function refreshChatHeader() {
  const sub=document.getElementById('chSub');
  if (!sub) return;
  if (activePeer==='group') { sub.textContent=`${onlineIds.size} of 10 online`; return; }
  if (activePeer) sub.textContent=onlineIds.has(activePeer.id)?'online':'last seen recently';
}

function refreshTypingBar() {
  const bar=document.getElementById('typingBar');
  if (!bar) return;
  const isGroup = activePeer==='group';
  let txt='';
  if (isGroup) {
    const names=USERS.filter(u=>u.id!==me?.id&&peerTyping[u.id]).map(u=>u.name);
    if (names.length) txt = names.length===1?`${names[0]} is typing`:names.length===2?`${names[0]} and ${names[1]} are typing`:`${names[0]} and ${names.length-1} others are typing`;
  } else if (activePeer) {
    if (dmTyping[activePeer.id]) txt = `${activePeer.name} is typing`;
  }
  bar.innerHTML = txt ? `<div class="tdots"><span></span><span></span><span></span></div><span>${txt}</span>` : '';
}

// ── REPLY ─────────────────────────────────────────────────────────────────────
let replyingTo = null; // { id, senderId, senderName, content, type }

function startReply(msgId) {
  // Find the message in allMessages or dmMessages
  const allMsgs = activePeer==='group'
    ? allMessages
    : (dmMessages[activePeer?.id] || []);
  const msg = allMsgs.find(m=>m.id===msgId);
  if (!msg) return;

  replyingTo = { id:msg.id, senderId:msg.senderId, senderName:msg.senderName, content:msg.content, type:msg.type };

  const senderUser = USERS.find(u=>u.id===msg.senderId);
  const previewText = msg.type==='file' ? '📎 File' : msg.content.slice(0,80);

  const bar = document.getElementById('replyBar');
  const senderEl = document.getElementById('replyBarSender');
  const textEl   = document.getElementById('replyBarText');
  if (!bar) return;

  senderEl.textContent = senderUser?.name || msg.senderName;
  senderEl.style.color = senderUser?.color || 'var(--green)';
  textEl.textContent   = previewText;
  bar.classList.add('show');
  document.getElementById('msgInput')?.focus();
}

function cancelReply() {
  replyingTo = null;
  const bar = document.getElementById('replyBar');
  if (bar) bar.classList.remove('show');
}

// ── @ MENTION ─────────────────────────────────────────────────────────────────
let mentionQuery = null;   // current @query being typed, or null
let mentionIndex = 0;      // keyboard-selected index in popup
let mentionStart = -1;     // cursor position where @ was typed

function getMentionCandidates(query) {
  const q = query.toLowerCase();
  const candidates = activePeer === 'group'
    ? USERS.filter(u => u.id !== me?.id)          // all other users in group
    : (activePeer ? [activePeer] : []);            // only the DM peer
  return candidates.filter(u => u.name.toLowerCase().startsWith(q));
}

function showMentionPopup(candidates, query) {
  const popup = document.getElementById('mentionPopup');
  if (!popup) return;
  if (!candidates.length) { hideMentionPopup(); return; }
  popup.innerHTML = `<div class="mention-header">Mention someone</div>` +
    candidates.map((u, i)=>`
      <div class="mention-item${i===mentionIndex?' active':''}"
        onmousedown="pickMention('${u.name}')" data-idx="${i}">
        <div class="mention-av" style="background:${u.color}">${u.name.charAt(0)}</div>
        <span class="mention-name">${esc(u.name)}</span>
      </div>`).join('');
  popup.classList.add('show');
}

function hideMentionPopup() {
  const popup = document.getElementById('mentionPopup');
  if (popup) popup.classList.remove('show');
  mentionQuery = null; mentionIndex = 0; mentionStart = -1;
}

function pickMention(name) {
  const inp = document.getElementById('msgInput');
  if (!inp) return;
  const val = inp.value;
  // Replace from mentionStart up to current cursor with @Name + space
  const before = val.slice(0, mentionStart);
  const after  = val.slice(inp.selectionStart);
  inp.value = before + '@' + name + ' ' + after;
  // Move cursor after the inserted mention
  const pos = before.length + name.length + 2;
  inp.setSelectionRange(pos, pos);
  hideMentionPopup();
  inp.focus();
}

// ── Input ─────────────────────────────────────────────────────────────────────
let tTimer=null, tActive=false;

function sendMsg() {
  if (!socket||!me||!activePeer) return;
  const inp=document.getElementById('msgInput');
  const content=inp?.value.trim();
  if (!content) return;
  hideMentionPopup();
  clearTimeout(tTimer);
  const isGroup = activePeer==='group';
  if (tActive) {
    isGroup ? socket.emit('typing_stop',{roomId:ROOM}) : socket.emit('dm_typing_stop',{toUserId:activePeer.id});
    tActive=false;
  }

  const payload = { content, replyTo: replyingTo || undefined };

  if (isGroup) {
    socket.emit('send_message',{roomId:ROOM, ...payload});
  } else {
    socket.emit('send_dm',{toUserId:activePeer.id, ...payload});
  }
  inp.value='';
  cancelReply();
}

function onKey(e) {
  const popup = document.getElementById('mentionPopup');
  const popupOpen = popup?.classList.contains('show');

  if (popupOpen) {
    const candidates = getMentionCandidates(mentionQuery||'');
    if (e.key==='ArrowDown') {
      e.preventDefault();
      mentionIndex = Math.min(mentionIndex+1, candidates.length-1);
      showMentionPopup(candidates, mentionQuery);
      return;
    }
    if (e.key==='ArrowUp') {
      e.preventDefault();
      mentionIndex = Math.max(mentionIndex-1, 0);
      showMentionPopup(candidates, mentionQuery);
      return;
    }
    if (e.key==='Enter' || e.key==='Tab') {
      e.preventDefault();
      if (candidates[mentionIndex]) pickMention(candidates[mentionIndex].name);
      return;
    }
    if (e.key==='Escape') { hideMentionPopup(); return; }
  }

  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function onType() {
  if(!socket||!me||!activePeer) return;
  const isGroup = activePeer==='group';
  if(!tActive){
    isGroup ? socket.emit('typing_start',{roomId:ROOM}) : socket.emit('dm_typing_start',{toUserId:activePeer.id});
    tActive=true;
  }
  clearTimeout(tTimer);
  tTimer=setTimeout(()=>{
    isGroup ? socket.emit('typing_stop',{roomId:ROOM}) : socket.emit('dm_typing_stop',{toUserId:activePeer.id});
    tActive=false;
  },2000);

  // ── Detect @ mention ──────────────────────────────────────────────────────
  const inp = document.getElementById('msgInput');
  if (!inp) return;
  const val = inp.value;
  const cursor = inp.selectionStart;

  // Scan backwards from cursor to find an @ that's either at start or after whitespace
  let atPos = -1;
  for (let i = cursor-1; i >= 0; i--) {
    if (val[i] === '@') {
      if (i === 0 || /\s/.test(val[i-1])) { atPos = i; break; }
    }
    if (/\s/.test(val[i])) break; // hit whitespace before finding @
  }

  if (atPos >= 0) {
    const query = val.slice(atPos+1, cursor);
    if (/^[\w]*$/.test(query)) { // only letters/digits/underscore — no spaces
      mentionQuery = query;
      mentionStart = atPos;
      mentionIndex = 0;
      const candidates = getMentionCandidates(query);
      showMentionPopup(candidates, query);
      return;
    }
  }
  hideMentionPopup();
}

// Close mention popup on outside click
document.addEventListener('click', e=>{
  if (!e.target.closest('#mentionPopup') && !e.target.closest('#msgInput'))
    hideMentionPopup();
});

// ── FILE UPLOAD ───────────────────────────────────────────────────────────────
const FILE_MAX_MB  = 5;
const FILE_MAX_B   = FILE_MAX_MB * 1024 * 1024;
const FILE_ALLOWED = new Set(['.pdf','.docx','.doc','.xlsx','.xls','.csv']);
const FILE_ICONS   = {
  pdf:  { icon:'📄', cls:'pdf'   },
  doc:  { icon:'📝', cls:'word'  },
  docx: { icon:'📝', cls:'word'  },
  xls:  { icon:'📊', cls:'excel' },
  xlsx: { icon:'📊', cls:'excel' },
  csv:  { icon:'📋', cls:'csv'   },
};

function fileExt(name) { return (name.split('.').pop()||'').toLowerCase(); }
function fileSizeLabel(bytes) {
  return bytes < 1024 ? `${bytes} B`
    : bytes < 1024*1024 ? `${(bytes/1024).toFixed(1)} KB`
    : `${(bytes/1024/1024).toFixed(2)} MB`;
}
function fileIconInfo(name) {
  return FILE_ICONS[fileExt(name)] || { icon:'📎', cls:'csv' };
}

function showUploadToast(msg, durationMs=3500) {
  const t = document.getElementById('uploadToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), durationMs);
}

function setUploadProgress(pct) {
  const bar  = document.getElementById('uploadBar');
  const wrap = document.getElementById('uploadProgress');
  if (!bar || !wrap) return;
  if (pct === null) { wrap.classList.remove('show'); bar.style.width='0%'; return; }
  wrap.classList.add('show');
  bar.style.width = pct + '%';
}

// Called when user picks a file via the hidden input
async function onFileChosen(input) {
  const file = input.files[0];
  input.value = ''; // reset so same file can be re-selected
  if (!file || !me || !activePeer) return;

  // ── Client-side validation ────────────────────────────────────────────────
  const ext = '.' + fileExt(file.name);
  if (!FILE_ALLOWED.has(ext)) {
    showUploadToast(`❌ File type not allowed. Use PDF, DOCX, XLSX or CSV.`);
    return;
  }
  if (file.size > FILE_MAX_B) {
    showUploadToast(`❌ File too large (${fileSizeLabel(file.size)}). Max is ${FILE_MAX_MB} MB.`);
    return;
  }

  // ── Upload via XHR (so we get progress events) ────────────────────────────
  const attachBtn = document.getElementById('attachBtn');
  if (attachBtn) attachBtn.disabled = true;
  setUploadProgress(0);

  const formData = new FormData();
  formData.append('file',     file);
  formData.append('username', me.name);

  try {
    const result = await uploadWithProgress(formData, pct => setUploadProgress(pct));

    if (!result.ok) {
      showUploadToast(`❌ ${result.error || 'Upload failed.'}`);
      return;
    }

    // ── Send as a file message ─────────────────────────────────────────────
    const filePayload = JSON.stringify(result.file);
    const isGroup = activePeer === 'group';

    if (isGroup) {
      socket.emit('send_message', { roomId: ROOM, content: filePayload, type: 'file' });
    } else {
      socket.emit('send_dm', { toUserId: activePeer.id, content: filePayload, type: 'file' });
    }

    setUploadProgress(100);
    setTimeout(() => setUploadProgress(null), 600);
    console.log(`[Upload] ✅ ${file.name} → ${result.file.url}`);

  } catch(e) {
    showUploadToast(`❌ Upload failed: ${e.message}`);
  } finally {
    if (attachBtn) attachBtn.disabled = false;
    setUploadProgress(null);
  }
}

function uploadWithProgress(formData, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/api/upload?username=${encodeURIComponent(me.name)}`);

    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 95));
    });

    xhr.addEventListener('load', () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch(e) { reject(new Error('Invalid server response')); }
    });
    xhr.addEventListener('error', () => reject(new Error('Network error')));
    xhr.addEventListener('abort', () => reject(new Error('Upload aborted')));

    xhr.send(formData);
  });
}

// ── VIDEO CALL ────────────────────────────────────────────────────────────────
const ICE_SERVERS = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
]};

let pc = null;           // RTCPeerConnection
let localStream = null;  // my camera+mic
let callPeerId = null;   // userId we're calling / being called by
let callPeerUser = null; // USERS obj for that peer
let isMuted = false;
let isCamOff = false;
let timerInterval = null;
let timerSecs = 0;

// Helper — get USERS entry for a userId
function userById(uid) { return USERS.find(u=>u.id===uid)||null; }

// ── Outgoing call ─────────────────────────────────────────────────────────────
async function startCall(toUserId) {
  if (!socket||!me) return;
  if (callPeerId) { alert('Already in a call'); return; }

  callPeerId   = toUserId;
  callPeerUser = userById(toUserId);

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  } catch(e) {
    // Camera not available (likely test env) — audio only / no stream
    localStream = null;
    console.warn('[Call] getUserMedia failed:', e.message);
  }

  pc = createPC(toUserId);
  if (localStream) {
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    document.getElementById('localVideo').srcObject = localStream;
  }

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Signal the callee — offer sent after they accept
  socket.emit('call_user', { toUserId });

  showCallScreen(callPeerUser, 'Calling…');
}

// ── Incoming call ─────────────────────────────────────────────────────────────
function onIncomingCall({ fromUserId, fromUsername }) {
  if (callPeerId) {
    // Already busy — auto-reject
    socket.emit('call_rejected', { toUserId: fromUserId });
    return;
  }
  callPeerId   = fromUserId;
  callPeerUser = userById(fromUserId) || { id: fromUserId, name: fromUsername, color:'#8696a0' };
  showCallToast(callPeerUser);
}

async function acceptCall() {
  hideCallToast();
  if (!callPeerId) return;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  } catch(e) {
    localStream = null;
    console.warn('[Call] getUserMedia failed:', e.message);
  }

  pc = createPC(callPeerId);
  if (localStream) {
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    document.getElementById('localVideo').srcObject = localStream;
  }

  socket.emit('call_accepted', { toUserId: callPeerId });
  showCallScreen(callPeerUser, 'Connecting…');
}

function rejectCall() {
  hideCallToast();
  if (callPeerId) socket.emit('call_rejected', { toUserId: callPeerId });
  callPeerId = null; callPeerUser = null;
}

// ── RTCPeerConnection factory ─────────────────────────────────────────────────
function createPC(peerId) {
  const conn = new RTCPeerConnection(ICE_SERVERS);

  conn.onicecandidate = e => {
    if (e.candidate) socket.emit('ice_candidate', { toUserId: peerId, candidate: e.candidate });
  };

  conn.ontrack = e => {
    const rv = document.getElementById('remoteVideo');
    if (rv) {
      rv.srcObject = e.streams[0];
      // remote video arrived — hide waiting state, start timer
      document.getElementById('callWaiting').style.display = 'none';
      startTimer();
    }
  };

  conn.onconnectionstatechange = () => {
    const s = conn.connectionState;
    const st = document.getElementById('cwStatus');
    if (st) st.textContent = s.charAt(0).toUpperCase() + s.slice(1);
    if (s === 'failed' || s === 'disconnected') hangUp();
  };

  return conn;
}

// ── Signaling event handlers (wired after socket is created) ─────────────────
function wireCallEvents() {
  socket.on('incoming_call', onIncomingCall);

  socket.on('call_accepted', async ({ fromUserId }) => {
    if (!pc) return;
    // Callee accepted — now send our offer
    const offer = pc.localDescription || await (async()=>{
      const o = await pc.createOffer();
      await pc.setLocalDescription(o);
      return pc.localDescription;
    })();
    socket.emit('call_offer', { toUserId: fromUserId, sdp: offer });
    const st = document.getElementById('cwStatus');
    if (st) st.textContent = 'Ringing…';
  });

  socket.on('call_rejected', () => {
    hangUp();
    appendSystemMsg('Call declined.');
  });

  socket.on('call_unavailable', () => {
    hangUp();
    appendSystemMsg('User is unavailable for calls.');
  });

  socket.on('call_offer', async ({ fromUserId, sdp }) => {
    if (!pc) return;
    await pc.setRemoteDescription(new RTCSessionDescription(sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('call_answer', { toUserId: fromUserId, sdp: answer });
  });

  socket.on('call_answer', async ({ sdp }) => {
    if (!pc) return;
    await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  });

  socket.on('ice_candidate', async ({ candidate }) => {
    if (!pc) return;
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){}
  });

  socket.on('call_ended', () => {
    hangUp();
    appendSystemMsg('Call ended.');
  });
}

// ── Hang up ───────────────────────────────────────────────────────────────────
function hangUp() {
  if (callPeerId && socket) socket.emit('end_call', { toUserId: callPeerId });

  if (pc)          { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream = null; }

  const rv = document.getElementById('remoteVideo');
  const lv = document.getElementById('localVideo');
  if (rv) rv.srcObject = null;
  if (lv) lv.srcObject = null;

  stopTimer();
  hideCallScreen();
  hideCallToast();

  callPeerId = null; callPeerUser = null;
  isMuted = false; isCamOff = false;
  updateMuteBtn(); updateCamBtn();
}

// ── Controls ──────────────────────────────────────────────────────────────────
function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  updateMuteBtn();
}
function toggleCam() {
  if (!localStream) return;
  isCamOff = !isCamOff;
  localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
  updateCamBtn();
}
function updateMuteBtn() {
  const b = document.getElementById('muteBtn');
  if (!b) return;
  b.textContent = isMuted ? '🔇' : '🎤';
  b.className   = `cc-btn mute${isMuted?' off':''}`;
}
function updateCamBtn() {
  const b = document.getElementById('camBtn');
  if (!b) return;
  b.textContent = isCamOff ? '🚫' : '📷';
  b.className   = `cc-btn cam${isCamOff?' off':''}`;
}

// ── Timer ─────────────────────────────────────────────────────────────────────
function startTimer() {
  if (timerInterval) return;
  timerSecs = 0;
  const el = document.getElementById('callTimer');
  if (el) el.classList.add('show');
  timerInterval = setInterval(()=>{
    timerSecs++;
    const m = Math.floor(timerSecs/60), s = timerSecs%60;
    if (el) el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval); timerInterval = null; timerSecs = 0;
  const el = document.getElementById('callTimer');
  if (el) { el.classList.remove('show'); el.textContent = '0:00'; }
}

function showCallToast(user) {

function appendSystemMsg(txt) {

}
